when:
  - event: manual
    branch: main
  - event: push
    branch: main

steps:
  - name: build
    image: codeberg.org/mark22k/ci:latest
    pull: true
    commands:
      - apt-get update
      - export PATH="$HOME/.local/bin:$PATH"
      - eval "$(luarocks path --bin)"
      - . "$HOME/.cargo/env"
      - make debian
